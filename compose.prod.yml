services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?falta DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${IMAGEN:?falta IMAGEN}-backend:${TAG:?falta TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:?falta DB_USER}:${DB_PASSWORD:?falta DB_PASSWORD}@db:5432/${DB_NAME:?falta DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:?falta CORS_ORIGIN}
      APP_VERSION: ${TAG}
      PORT: 3001
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?falta SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?falta SEED_ADMIN_PASSWORD}
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${IMAGEN:?falta IMAGEN}-frontend:${TAG:?falta TAG}
    restart: unless-stopped
    environment:
      PORT: 3000
    expose:
      - "3000"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
